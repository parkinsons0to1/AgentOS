# Example AgentOS session spec.
# Run with:  agentd run -spec examples/session.yaml -secrets examples/secrets.yaml
name: demo
runtime:
  # Any agent harness works here — Claude Code headless, OpenClaw, or a plain
  # shell for kicking the tires.
  command: ["bash", "-lc", "cat $AGENTOS_MANIFEST && curl -s $AGENTOS_GATEWAY/egress/api.github.com/zen && echo"]
workspace: ./workspace
budgets:
  wall_clock_seconds: 300
  max_egress_requests: 50
  max_tool_calls: 25
egress:
  - host: api.github.com
    secret: github-token
    inject:
      header: Authorization
      format: "Bearer {secret}"
  - host: api.anthropic.com
    secret: anthropic-key
    inject:
      header: x-api-key
      format: "{secret}"
# MCP servers are spawned lazily on first use and reached through the gateway:
#   curl $AGENTOS_GATEWAY/tool                          # list servers
#   curl $AGENTOS_GATEWAY/tool/<server>                 # list its tools
#   curl -X POST $AGENTOS_GATEWAY/tool/<server>/<tool> -d '{...}'
mcp_servers: []
